<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Contact</title>

<link rel="stylesheet" href="math.css">

<style>
.contact-box{
    max-width:520px;
    margin:60px auto;
    padding:25px;
}

.contact-box h2{
    margin-bottom:10px;
}

.contact-box p{
    font-size:0.9em;
    opacity:0.8;
}

.contact-box input,
.contact-box textarea{
    width:100%;
    padding:8px;
    margin-top:8px;
    margin-bottom:14px;
}

.contact-box button{
    padding:8px 18px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="contact-box">

<h2>Send a message</h2>

<p>
If you wish, you can send a short message.  
I read letters from time to time and may reply when possible.
</p>

<form id="contactForm"
action="https://formspree.io/f/yourID"
method="POST">

<label>Subject</label>
<input type="text" name="subject" required>

<label>Message</label>
<textarea name="message" rows="5" required></textarea>

<label>Your name</label>
<input type="text" name="name">

<label>Email</label>
<input type="email" name="email">

<!-- анти-бот поле -->
<input type="text" name="website" style="display:none">

<button type="submit">Send</button>

</form>

<p id="formStatus"></p>

</div>

<script>

const form = document.getElementById("contactForm")
const status = document.getElementById("formStatus")

form.addEventListener("submit", async function(e){

e.preventDefault()

let data = new FormData(form)

let response = await fetch(form.action,{
method:form.method,
body:data,
headers:{ 'Accept':'application/json'}
})

if(response.ok){

status.innerHTML="Message sent. Thank you."
form.reset()

}else{

status.innerHTML="Something went wrong."

}

})

</script>

</body>
</html>
