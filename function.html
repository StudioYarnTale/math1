<style>

.logo-yt{
position:absolute;
top:10px;
right:100px;
width:130px;
height:auto;
cursor:pointer;
transition:transform 0.2s;
}

img.h2img{width:60px; margin-bottom:-20px;}

button{
min-width:36px;
padding:4px 8px;
display:flex;
align-items:center;
justify-content:center;
}

button.colour{
width:25px;
height:25px;
min-width:25px;
padding:0;
border-radius:6px;
display:inline-block;
border:1px solid #999999;
}

button.colour:hover{
filter:brightness(120%);
border:1px solid #666666;
box-shadow:0 1px 2px rgba(0,0,0,0.25);
}

.table{width:100%;}

<body>
<div class="main">
    
<!-- ===== NAV MENU ===== -->
<div class="links-panel">
<div class="link-grouph">
<a class="link-buttonh" href="https://studioyarntale.github.io/yt/" target="_blank">🏡YarnTale</a>
<a class="link-buttonh" href="https://studioyarntale.github.io/math1/" target="_blank">🧮Math Playground</a>

</div>

<br/>


<div class="app-container">
<a href="<a href="index.html"><img src="images/ytmath_logo.png" class="logo-yt"></a>

<div class="top-buttons">


<div class="toolbar"><!--Top toolbar-->
<h2><img class="h2img" src="images/graph.png"/> Function Grapher</h2>

</div><div class="toolbar">
<i>Canvas Range: &nbsp; x<sub>min</sub></i> <input class="func" id="xmin" value="-10" size="1"> &nbsp; 
<i>x<sub>max</sub></i> <input class="func" id="xmax" value="10" size="1"> 
<button class="bigButton" onclick="updateRange()">Set range</button>
</div><!--Top toolbar-->




<div class="toolbar"><!--Function toolbar-->
<i>Coordinates:</i><select class="func" style="height:25px; width:100px;"  id="functionType" onchange="updateFunctionInputs()">
<option value="cartesian">Cartesian</option>
<option value="parametric">Parametric</option>
<option value="polar">Polar</option>
</select> 

<span id="cartesianBlock"><i>f(x) = </i>
<input id="fx" class="func" style="width:260px" placeholder="Example: sin(x)">
</span>

<span id="parametricBlock" style="display:none">
<i>x(t) = </i>
<input id="xt" class="func" style="width:160px"> &nbsp;
<i>y(t) = </i>
<input id="yt" class="func" style="width:160px">
</span>

<span id="polarBlock" style="display:none">
<i>r(φ) = </i>
<input id="rf" class="func" style="width:260px" placeholder="Example: sin(3*φ)">
</span>

<button  onclick="drawFunctionInput()">Draw Function</button> 
<button  onclick="deleteLast()">←</button> 
<button  onclick="clearFunctions()">Clear</button>
</div><!--Function toolbar-->






<br/>

<div class="func-buttons" ><!--Keyboard Buttons toolbar-->
	<button onclick="insertText('x')"><span style="font-family: Cambria Math;"><i>x</i></span></button> 
	<button onclick="insertText('t')"><i>t</i></button> 	
	<button onclick="insertText('fi')"><i>φ</i></button>
    <button onclick="insertText('Math.PI')">π</button>	
	<button onclick="insertText('Math.E')">e</button>
	<button onclick="insertText('rad(')">rad</button>
    <button onclick="insertText('deg(')">deg</button>
	<button onclick="insertText('.')">.</button>
    <button onclick="insertText('(')">(</button>
    <button onclick="insertText(')')">)</button>  

		<!-- функции -->
	<button onclick="insertText('x^2')">x<sup>2</sup></button>		
	<button onclick="insertText('x^3')">x<sup>3</sup></button>
	<button onclick="insertText('1/x')">1/x</button>
	<button onclick="insertText('sqrt(')">√x</button>	
	<button onclick="insertText('x^(1/3)')">∛x</button>
	<button onclick="insertText('sin(x)')">sin(x)</button>
    <button onclick="insertText('cos(x)')">cos(x)</button>
    <button onclick="insertText('tan(x)')">tan(x)</button>
    <button onclick="insertText('log(x)')">log(x)</button>	
	<button onclick="insertText('exp(x)')">exp(x)</button>
	</div> 
    <!-- числа -->
	<div class="func-buttons" >
    <button onclick="insertText('1')">1</button>
    <button onclick="insertText('2')">2</button>
    <button onclick="insertText('3')">3</button>
    <button onclick="insertText('4')">4</button>
    <button onclick="insertText('5')">5</button>
    <button onclick="insertText('6')">6</button>
    <button onclick="insertText('7')">7</button>
    <button onclick="insertText('8')">8</button>
    <button onclick="insertText('9')">9</button>
    <button onclick="insertText('0')">0</button>

    <button onclick="insertText('+')">+</button>
    <button onclick="insertText('-')">−</button>
    <button onclick="insertText('*')">*</button>
    <button onclick="insertText('/')">/</button>
    <button onclick="insertText('^')">^</button>
	<button onclick="insertText('sqrt(')">√</button>
    <button onclick="insertText('exp(')">exp</button>
    <button onclick="insertText('log(')">log</button>
    <button onclick="insertText('log10(')">log10</button>
    <button onclick="insertText('abs(')">abs</button>
  	</div>  
	
    <div class="func-buttons" style="grid-template-columns: repeat(6, 50px);">
	<button onclick="insertText('sin(')">sin</button>
    <button onclick="insertText('cos(')">cos</button>
    <button onclick="insertText('tan(')">tan</button>
    <button onclick="insertText('sinh(')">sinh</button>
    <button onclick="insertText('cosh(')">cosh</button>
    <button onclick="insertText('tanh(')">tanh</button>
	
	<button onclick="insertText('asin(')">asin</button>
    <button onclick="insertText('acos(')">acos</button>
    <button onclick="insertText('atan(')">atan</button>
    <button onclick="insertText('asinh(')">asinh</button>
    <button onclick="insertText('acosh(')">acosh</button>
    <button onclick="insertText('atanh(')">atanh</button>

</div><!--Keyboard Buttons toolbar-->


<br/>
<div class="toolbar"><!--Drawing toolbar-->
<button class="colour" style="background:#cc0000;" onclick="setColor('#cc0000')"></button> 
<button class="colour" style="background:#00cc00;" onclick="setColor('#00cc00')"></button> 
<button class="colour" style="background:#0000cc;" onclick="setColor('#0000cc')"></button> 
<button class="colour" style="background:#cc9f00;" onclick="setColor('#cc9f00')"></button> 
<button class="colour" style="background:#009999;" onclick="setColor('#009999')"></button> 
<button class="colour" style="background:#cc0099;" onclick="setColor('#cc0099')"></button> 
<button class="colour" style="background:#000000;" onclick="setColor('#000000')"></button> 

<label style="margin-left:10px;">
<input type="checkbox" id="snapToggle" checked><i>Snap to grid</i></label> &nbsp; 
<button class="bigButton" onclick="mode='point'">Draw Point</button> 
<button class="bigButton" onclick="mode='vector'">Draw Vector</button> 
<button class="bigButton" onclick="mode='line'">Draw Line</button>
<button class="bigButton" onclick="mode='freehand'">Freehand</button>
<button class="bigButton" onclick="mode='text'">Text</button>
</div><div class="toolbar">
<button class="bigButton" style="width:160px;" onclick="clearCanvas()">Clear Canvas</button> 
</div><!--Drawing toolbar-->




</div><!--TopButtons toolbar-->



<div class="canvas"><!--Canvas-->
<canvas id="grid" width="840px" height="840px"></canvas>
<div id="coords"></div>
</div>



<div id="functionTables"></div><!--Tables-->
