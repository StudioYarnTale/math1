<script>
    let targetX = null;
    let isLocked = false; 
    let selectedSide = 'left'; 
    const inputField = document.getElementById('mathExpression');

    // Карта символов для твоих кнопок-картинок
    const itemMap = {
        'b0.png':'0', 'b1.png':'1', 'b2.png':'2', 'b3.png':'3', 'b4.png':'4',
        'b5.png':'5', 'b6.png':'6', 'b7.png':'7', 'b8.png':'8', 'b9.png':'9', 'b10.png':'10',
        'w_plus.png':'+', 'w_minus.png':'-', 'w_mult.png':'*', 'w_div.png':'/',
        'w(.png':'(', 'w).png':')', 'w_dot.png':'.', 'wx.png':'x', 'w_eq.png':'='
    };


function solve(expr, xVal) {
        try {
            let f = expr.replace(/(\d)x/g, '$1*' + xVal).replace(/x/g, '('+xVal+')');
            return eval(f);
        } catch (e) { return null; }
}


function findX(l, r) {
        let bestX = 10, minDiff = Infinity;
        for (let i = -1000; i <= 1000; i++) {
            let tx = i / 10;
            let diff = Math.abs(solve(l, tx) - solve(r, tx));
            if (diff < minDiff) { minDiff = diff; bestX = tx; }
        }
        return minDiff < 0.1 ? bestX : 10;
}




// Твой алгоритм для кнопки GO
function activateScales() {
        const text = inputField.value;
        if (!text.includes('=')) return;

        let sides = text.split('=');
        let leftExpr = sides[0];
        let rightExpr = sides[1];

        // 1. Если это ПЕРВОЕ нажатие - находим X и фиксируем его
        if (!isLocked) {
            let foundX = findX(leftExpr, rightExpr);
            if (foundX !== null) {
                targetX = foundX;
                isLocked = true;
                console.log("X зафиксирован:", targetX);
            }
        }
        // 2. Упрощаем выражение (схлопываем кучи)
        let simpleL = mathSimplify(leftExpr);
        let simpleR = mathSimplify(rightExpr);
        // 3. Выдаем результат в бокс и на чаши
        inputField.value = simpleL + "=" + simpleR;
        updateVisuals();
}




function tiltScales(diff) {
        let offset = Math.max(-60, Math.min(60, diff * 3));
        document.querySelectorAll(".left, .leftPan, #leftDisplay").forEach(el => {
            if(el) el.style.transform = `translateY(${offset}px)`;
        });
        document.querySelectorAll(".right, .rightPan, #rightDisplay").forEach(el => {
            if(el) el.style.transform = `translateY(${-offset}px)`;
        });
        const ls = document.querySelector(".left_spring");
        const rs = document.querySelector(".right_spring");
        if(ls) ls.style.transform = `scaleY(${1 - offset/160})`;
        if(rs) rs.style.transform = `scaleY(${1 + offset/160})`;
}
	


function updateVisuals() {
        const text = inputField.value;
        const sides = text.split('=');
        const lText = sides[0] || "0";
        const rText = sides[1] || "0";

        document.getElementById('leftDisplay').innerText = lText;
        document.getElementById('rightDisplay').innerText = rText;

        // Если нажата GO - считаем веса на основе константы targetX
        if (isLocked && targetX !== null) {
            let lW = solve(lText, targetX);
            let rW = solve(rText, targetX);
            tiltScales(lW - rW);
            updateBalanceIcon(lW, rW);
        } else {
            // До нажатия GO весы стоят ровно
            tiltScales(0);
            checkGoBtn();
        }
}



function updateBalanceIcon(lW, rW) {
    const icon = document.getElementById('balanceIcon');
    if (!icon) return;

    // Округляем до 2 знаков, чтобы избежать мизерных погрешностей JS
    const diff = Math.round((lW - rW) * 100) / 100;

    if (diff === 0) {
        // Веса равны
        icon.src = "images/app_scales/digit/eq.png";
    } else if (diff > 0) {
        // Лево тяжелее (L > R)
        icon.src = "images/app_scales/digit/gt.png";
    } else {
        // Право тяжелее (L < R)
        icon.src = "images/app_scales/digit/lt.png";
    }
}


function selectSide(side) {
    selectedSide = side;
    
    // Убираем класс active у всех и добавляем нужному
    document.getElementById('leftCircle').classList.remove('active');
    document.getElementById('rightCircle').classList.remove('active');
    
    if (side === 'left') {
        document.getElementById('leftCircle').classList.add('active');
    } else {
        document.getElementById('rightCircle').classList.add('active');
    }
    
    console.log("Выбрана чаша:", side === 'left' ? "Левая" : "Правая");
}

function checkGoBtn() {
    const btn = document.getElementById('goBtnImg');
    if (!btn) return;

    // Если есть знак "=" и весы не заблокированы — ставим "активную" картинку
    if (inputField.value.includes('=') && !isLocked) {
        if (btn.src.indexOf("btnGo1.png") === -1) { 
            btn.src = "images/app_scales/digit/btnGo1.png";
        }
        btn.style.cursor = "pointer";
    } else {
        // В остальных случаях — начальная картинка
        if (btn.src.indexOf("btnGo0.png") === -1) {
            btn.src = "images/app_scales/digit/btnGo0.png";
        }
        btn.style.cursor = "default";
    }
}

function addSym1(input) {
    let char = (typeof input === 'string' && input.includes('/')) 
               ? (itemMap[input.split('/').pop()] || '') 
               : input;

    const rewardImg = document.getElementById('rewardImg');
    const rewardText = document.getElementById('rewardText');
    const inputField = document.getElementById('mathExpression');

    if (isLocked) {
        let sides = inputField.value.split('=');
        let left = sides[0] || "";
        let right = sides[1] || "";
        let currentSideText = (selectedSide === 'left') ? left : right;

        // ПРОВЕРКА НА СКОБКИ ПРИ УМНОЖЕНИИ/ДЕЛЕНИИ
        if (char === '*' || char === '/') {
            const hasPlusMinus = /[+\-]/.test(currentSideText);
            const hasBrackets = currentSideText.includes('(') && currentSideText.includes(')');

            if (hasPlusMinus && !hasBrackets) {
                // СЛУЧАЙ 1: ЗАБЫЛ (Перец + Мигание)
                currentSideText = "(" + currentSideText + ")";
                rewardImg.src = "images/app_scales/digit/pepper.png";
                rewardImg.style.display = "block";
                rewardText.innerText = "You forgot the brackets! (Мешок-скобки)";
                rewardText.style.color = "red";
                inputField.classList.add('flash-error');
                setTimeout(() => inputField.classList.remove('flash-error'), 800);
            } 
            else if (hasPlusMinus && hasBrackets) {
                // СЛУЧАЙ 2: САМ ПОСТАВИЛ (Конфета)
                rewardImg.src = "images/app_scales/digit/f11.png";
                rewardImg.style.display = "block";
                rewardText.innerText = "Well done! 🍬 Молодец!";
                rewardText.style.color = "green";
            }
        }

        if (selectedSide === 'left') left = currentSideText + char;
        else right = currentSideText + char;
        inputField.value = left + "=" + right;
        
    } else {
        inputField.value += char;
    }
    
    updateVisuals();
    
    // Прячем уведомление через 3 секунды, чтобы не мешало
    setTimeout(() => {
        rewardImg.style.display = "none";
        rewardText.innerText = "";
    }, 3000);
}

        }
        updateVisuals(); 
}

// ==============debug
function mathSimplify1(expr) {
        if (!expr || expr === "0") return "0";
        try {
            // Обработка деления/умножения
            if (expr.includes('/') || expr.includes('*')) {
                if (expr.includes('x')) {
                    let check = expr.replace(/(\d)x/g, '$1*1').replace(/x/g, '1');
                    let newCoeff = eval(check);
                    if (newCoeff === 1) return "x";
                    if (newCoeff === -1) return "-x";
                    return newCoeff + "x";
                }
                return eval(expr).toString();
            }

            // Группировка + и -
            let tokens = expr.replace(/-/g, "+-").split('+');
            let cSum = 0, xSum = 0;
            tokens.forEach(t => {
                if (t.includes('x')) {
                    let v = t.replace('x', '');
                    xSum += (v === "" || v === "+") ? 1 : (v === "-") ? -1 : parseFloat(v);
                } else if (t && !isNaN(t)) {
                    cSum += parseFloat(t);
                }
            });
            let res = [];
            if (xSum !== 0) res.push((xSum === 1 ? "" : xSum === -1 ? "-" : xSum) + "x");
            if (cSum !== 0 || res.length === 0) {
                res.push((cSum > 0 && res.length > 0 ? "+" : "") + cSum);
            }
            return res.join("").replace(/\+\-/g, "-");
        } catch (e) { return expr; }
}

function mathSimplify2(expr) {

    if (!expr || expr === "0") return "0";

    try {

        // --- НОРМАЛИЗАЦИЯ ЗАПИСИ ---

        // 2x → 2*x
        expr = expr.replace(/(\d)(x)/g, '$1*$2');

        // 2( → 2*(
        expr = expr.replace(/(\d)\(/g, '$1*(');

        // --- ЕСЛИ ЕСТЬ СКОБКИ → НЕ УПРОЩАЕМ ---
        // это защищает от неправильного раскрытия
        if (expr.includes('(') || expr.includes(')')) {
            return expr;
        }

        // --- УМНОЖЕНИЕ И ДЕЛЕНИЕ ---
        if (expr.includes('*') || expr.includes('/')) {

            if (expr.includes('x')) {

                // заменяем x на 1 чтобы найти коэффициент
                let check = expr
                    .replace(/(\d)\*x/g, '$1*1')
                    .replace(/x/g, '1');

                let newCoeff = eval(check);

                if (newCoeff === 1) return "x";
                if (newCoeff === -1) return "-x";

                return newCoeff + "x";
            }

            return eval(expr).toString();
        }

        // --- СЛОЖЕНИЕ И ВЫЧИТАНИЕ ---
        let tokens = expr.replace(/-/g, "+-").split('+');

        let cSum = 0;
        let xSum = 0;

        tokens.forEach(t => {

            if (t.includes('x')) {

                let v = t.replace('x','');

                if (v === "" || v === "+") v = 1;
                else if (v === "-") v = -1;
                else v = parseFloat(v);

                xSum += v;

            }
            else if (t && !isNaN(t)) {

                cSum += parseFloat(t);

            }

        });

        let res = [];

        if (xSum !== 0) {
            res.push(
                (xSum === 1 ? "" :
                 xSum === -1 ? "-" :
                 xSum) + "x"
            );
        }

        if (cSum !== 0 || res.length === 0) {
            res.push(
                (cSum > 0 && res.length > 0 ? "+" : "") + cSum
            );
        }

        return res.join("").replace(/\+\-/g,"-");

    }

    catch(e) {
        return expr;
    }
}

// Кнопка BACKSPACE (w_del.png)
function backspace() {
    let text = inputField.value;
    if (!text) return;
    
    // Если мы в режиме решения, стираем только в активной чаше
    if (isLocked) {
        let sides = text.split('=');
        let left = sides[0];
        let right = sides[1];
        if (selectedSide === 'left') left = left.slice(0, -1) || "0";
        else right = right.slice(0, -1) || "0";
        inputField.value = left + "=" + right;
    } else {
        // До GO - просто стираем последний символ в строке
        inputField.value = text.slice(0, -1);
    }
    updateVisuals();
}


// Кнопка SWAP (go1.png)
function swapSides() {
    if (!inputField.value.includes('=')) return;
    let sides = inputField.value.split('=');
    inputField.value = sides[1] + "=" + sides[0];
    updateVisuals();
}
	

function clearAll() {
        inputField.value = "";
        isLocked = false;
        targetX = null;
        updateVisuals();
}

// Слушатель клавиатуры
inputField.addEventListener('input', updateVisuals);
