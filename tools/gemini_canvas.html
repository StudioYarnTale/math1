    <title>Математический Микроскоп</title>
    <style>
        body { margin: 0; overflow: hidden; background: #eee; }
        canvas { display: block; cursor: crosshair; }
    </style>
</head>
<body>

<canvas id="microscope"></canvas>

<script>
    const canvas = document.getElementById('microscope');
    const ctx = canvas.getContext('2d');

    let width, height;
    let zoom = 50; // Пикселей в одной единице
    let offset = { x: 0, y: 0 };
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        offset.x = width / 2;
        offset.y = height / 2;
        draw();
    }


function getSuperscript(num) {
    const superscripts = {
        '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
        '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻'
    };
    return num.toString().split('').map(char => superscripts[char] || char).join('');
}

function formatLabel(num) {
    let absNum = Math.abs(num);
    if (absNum === 0) return "0";

    if (absNum < 0.0001 || absNum >= 10000) {
        let expParts = num.toExponential(0).split('e'); // Округляем мантиссу до 0 знаков после запятой
        let base = expParts[0];
        let exponent = parseInt(expParts[1]);
        return base + '·10' + getSuperscript(exponent);
    }
    // Для обычных чисел убираем лишние нули в конце
    return parseFloat(num.toFixed(10)).toString();
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    // 1. Вычисляем основной масштаб (major)
    // Делаем так, чтобы шаг всегда был степенью десятки
    let stepPower = Math.floor(Math.log10(100 / zoom));
    let majorStep = Math.pow(10, stepPower);
    let minorStep = majorStep / 10;

    // 2. Рисуем МЕЛКУЮ сетку (minor) - цвет #cccccc
    ctx.strokeStyle = "#cccccc";
    ctx.lineWidth = 1;
    drawLines(minorStep, false); // false - не рисуем подписи для мелочи

    // 3. Рисуем ГЛАВНУЮ сетку (major) - твой зеленый или темно-серый
    ctx.strokeStyle = "#4a6741"; // Твой зеленый цвет с картинки
    ctx.lineWidth = 2;
    drawLines(majorStep, true);  // true - рисуем подписи

    // 4. Отрисовка главных осей (X и Y)
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, offset.y); ctx.lineTo(width, offset.y);
    ctx.moveTo(offset.x, 0); ctx.lineTo(offset.x, height);
    ctx.stroke();

    requestAnimationFrame(draw);
}

function drawLines(step, withLabels) {
    let distanceOnScreen = step * zoom; 
    let showLabelsNow = withLabels && (distanceOnScreen > 50);

    // Вычисляем границы для отрисовки
    let startX = Math.floor(-offset.x / (step * zoom)) * step;
    let endX = Math.ceil((width - offset.x) / (step * zoom)) * step;
    let startY = Math.floor((offset.y - height) / (step * zoom)) * step;
    let endY = Math.ceil(offset.y / (step * zoom)) * step;

    ctx.beginPath();
    
    // Вертикальные линии (ось X)
    for (let x = startX; x <= endX; x += step) {
        let canvasX = x * zoom + offset.x;
        ctx.moveTo(canvasX, 0); 
        ctx.lineTo(canvasX, height);
        
        if (showLabelsNow && Math.abs(x) > step / 2) {
            ctx.fillStyle = "#4a6741";
            ctx.font = "bold 14px Arial";
            ctx.fillText(formatLabel(x), canvasX + 5, offset.y - 10);
        }
    }

    // Горизонтальные линии (ось Y)
    for (let y = startY; y <= endY; y += step) {
        let canvasY = -y * zoom + offset.y; 
        ctx.moveTo(0, canvasY); 
        ctx.lineTo(width, canvasY);
        
        if (showLabelsNow && Math.abs(y) > step / 2) {
            ctx.fillStyle = "#4a6741";
            ctx.font = "bold 14px Arial";
            // Текст привязываем к оси Y (offset.x), а не к краю экрана
            ctx.fillText(formatLabel(y), offset.x + 8, canvasY - 5);
        }
    }
    ctx.stroke();
}



    function drawGrid(step, labels) {
        ctx.beginPath();
        let startX = Math.floor(-offset.x / (step * zoom)) * step;
        let endX = Math.ceil((width - offset.x) / (step * zoom)) * step;
        let startY = Math.floor(-offset.y / (step * zoom)) * step;
        let endY = Math.ceil((height - offset.y) / (step * zoom)) * step;

        for (let x = startX; x <= endX; x += step) {
            let canvasX = x * zoom + offset.x;
            ctx.moveTo(canvasX, 0); ctx.lineTo(canvasX, height);
if (labels && Math.abs(x) > step/2) {
    ctx.fillStyle = "#336633";
    ctx.font = "bold 16px Garamond"; // Сделали жирным и покрупнее
    let label = formatLabel(x);
    ctx.fillText(label, canvasX + 4, offset.y - 8); // Чуть отодвинули от осей
}
        }
        for (let y = startY; y <= endY; y += step) {
            let canvasY = -y * zoom + offset.y;
            ctx.moveTo(0, canvasY); ctx.lineTo(width, canvasY);
            if (labels && Math.abs(y) > step/2) {
                ctx.fillText(formatLabel(y), offset.x + 5, canvasY - 2);
            }
        }
        ctx.stroke();
    }








    // Обработка мышки
    window.addEventListener('wheel', e => {
        const mouseX = e.clientX - offset.x;
        const mouseY = e.clientY - offset.y;
        const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
        
        zoom *= zoomFactor;
        offset.x = e.clientX - mouseX * zoomFactor;
        offset.y = e.clientY - mouseY * zoomFactor;
    });

    window.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
        if (isDragging) {
            offset.x += e.clientX - lastMouse.x;
            offset.y += e.clientY - lastMouse.y;
            lastMouse = { x: e.clientX, y: e.clientY };
        }
    });

    window.addEventListener('resize', init);
    init();
</script>
