<style>
/* ===== MATCH BOARD ===== */
/* ===== MATCH MAIN CONTAINER ===== */

.match-container{
max-width:900px;
margin:40px auto;
padding:30px;
background:#f9fbfa;
border:2px solid #9ec7c4;
border-radius:24px;
box-shadow:0 6px 14px rgba(0,0,0,0.08);
text-align:center;
}

/* ===== TITLE ===== */

.match-title{
font-size:30px;
color:#4f8f8b;
margin-bottom:10px;
}

.match-timer{
font-size:18px;
color:#6b8f8c;
margin-bottom:20px;
}

/* ===== BOARD ===== */

.match-board{
display:flex;
justify-content:center;
gap:80px;
margin-top:20px;
flex-wrap:wrap;
}

/* ===== COLUMNS ===== */

.match-column{
display:flex;
flex-direction:column;
gap:10px;
}

/* ===== BUTTONS ===== */

.match-btn{
width:200px;
padding:10px;
border-radius:14px;
border:2px solid #78AFAC;
background:white;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

.match-btn:hover{
background:#e6f3f2;
}

.match-selected{
background:khaki;
}

.match-correct{
background:lightgreen;
}

.match-wrong{
background:salmon;
}

/* ===== RESULTS ===== */

.results-box{
margin-top:20px;
text-align:left;
}

.result-item{
padding:6px 12px;
margin:4px 0;
background:#ffffff;
border-radius:10px;
border-left:6px solid #78AFAC;
}

/* ===== RESTART BUTTON ===== */

.restart-btn{
margin-top:25px;
padding:10px 22px;
font-size:18px;
border-radius:14px;
border:2px solid #78AFAC;
background:white;
cursor:pointer;
transition:0.2s;
}

.restart-btn:hover{
background:#e6f3f2;
}


</style>

<body>

  <h2 id="question"></h2>
  <div id="answers"></div>

<!--<script src="script/match.js"></script>-->
<script>

let pairs = [];
let shuffledLeft = [];
let shuffledRight = [];

let selectedLeft = null;
let selectedRight = null;
let selectedLeftBtn = null;
let selectedRightBtn = null;
let solvedLeft = [];
let solvedRight = [];

let matches = 0;
let results = [];

let startTime;
let endTime;
let playerName = "";




// загрузка данных


fetch("jsonfiles/match.json")
  .then(res => {
    if (!res.ok) {
      throw new Error("JSON not found");
    }
    return res.json();
  })
  .then(data => {
    pairs = data;
    showNameScreen();
  })
  .catch(err => {
    document.getElementById("quiz").innerHTML =
      "<h2>❌ Cannot load match.json</h2>";
    console.error(err);
  });




function showNameScreen() {
  document.getElementById("quiz").innerHTML = `
    <h2>What is your name?</h2>
    <input id="nameInput" placeholder="Enter your name">
    <br><br>
    <button onclick="startGame()">Start matching</button>
  `;
}




function startGame() {
  const input = document.getElementById("nameInput").value.trim();
  if (input === "") return alert("Enter name 😊");
  playerName = input;
  startTime = Date.now();
  shuffledLeft = [...pairs].sort(() => Math.random() - 0.5);
  shuffledRight = [...pairs].sort(() => Math.random() - 0.5);
  drawBoard();
}



function drawBoard1() {
  let leftHTML = "";
  let rightHTML = "";
  shuffledLeft.forEach(p => {
    const solved = solvedLeft.includes(p.left);
    const color = solved ? "lightgreen" : "";
    const disabled = solved ? "disabled" : "";
    leftHTML += `
      <button style="background:${color}" ${disabled}
      onclick="selectLeft('${p.left}')">${p.left}</button><br>`;
  });
  shuffledRight.forEach(p => {
    const solved = solvedRight.includes(p.right);
    const color = solved ? "lightgreen" : "";
    const disabled = solved ? "disabled" : "";
    rightHTML += `
      <button style="background:${color}" ${disabled}
      onclick="selectRight('${p.right}')">${p.right}</button><br>`;
  });
  document.getElementById("quiz").innerHTML = `
    <h2>Match the pairs</h2>
    <p id="timer"></p>
    <div style="display:flex; gap:40px">
      <div>${leftHTML}</div>
      <div>${rightHTML}</div>
    </div>
  `;
}





function updateTimer() {
  const sec = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById("timer").textContent = "Time: " + sec + "s";
}





function selectLeft(word) {
  selectedLeft = word;
  if (selectedLeftBtn) selectedLeftBtn.style.background = "";
  const buttons = document.querySelectorAll("button");
  buttons.forEach(btn => {
    if (btn.textContent === word && !btn.disabled) {
      selectedLeftBtn = btn;
      btn.style.background = "khaki";
    }
  });
  checkMatch();
}




function selectRight(word) {
  selectedRight = word;
  if (selectedRightBtn) selectedRightBtn.style.background = "";
  const buttons = document.querySelectorAll("button");
  buttons.forEach(btn => {
    if (btn.textContent === word && !btn.disabled) {
      selectedRightBtn = btn;
      btn.style.background = "khaki";
    }
  });
  checkMatch();
}





function checkMatch() {
  if (!selectedLeft || !selectedRight) return;

  const pair = pairs.find(p => p.left === selectedLeft);

  if (pair.right === selectedRight) {
    // правильная пара
    matches++;
    solvedLeft.push(selectedLeft);
    solvedRight.push(selectedRight);
    selectedLeftBtn.style.background = "lightgreen";
    selectedRightBtn.style.background = "lightgreen";
    selectedLeftBtn.disabled = true;
    selectedRightBtn.disabled = true;
    results.push(`✅ ${selectedLeft} = ${selectedRight}`);
    resetSelection();
  } else {
    // неправильная пара
    selectedLeftBtn.style.background = "salmon";
    selectedRightBtn.style.background = "salmon";
    results.push(`❌ ${selectedLeft} ≠ ${selectedRight} (correct: ${pair.right})`);
    setTimeout(() => {
      selectedLeftBtn.style.background = "";
      selectedRightBtn.style.background = "";
      resetSelection();
    }, 700);
  }
  if (matches === pairs.length) finishGame();
}



function flashWrong() {
  const body = document.body;
  body.style.background = "#ffdddd";
  setTimeout(() => {
    body.style.background = "";
  }, 300);
}


function resetSelection() {
  selectedLeft = null;
  selectedRight = null;
  selectedLeftBtn = null;
  selectedRightBtn = null;
}


function drawBoard(){
let leftHTML="";
let rightHTML="";
shuffledLeft.forEach(p=>{
const solved=solvedLeft.includes(p.left);
const disabled=solved?"disabled":"";
const cls=solved?"match-btn match-correct":"match-btn";
leftHTML+=`
<button class="${cls}" ${disabled}
onclick="selectLeft('${p.left}')">${p.left}</button>`;
});
shuffledRight.forEach(p=>{
const solved=solvedRight.includes(p.right);
const disabled=solved?"disabled":"";
const cls=solved?"match-btn match-correct":"match-btn";
rightHTML+=`
<button class="${cls}" ${disabled}
onclick="selectRight('${p.right}')">${p.right}</button>`;
});
document.getElementById("quiz").innerHTML=`
<div class="match-container">
<h2 class="match-title">🧩 Match the pairs</h2>
<p id="timer" class="match-timer"></p>
<div class="match-board">
<div class="match-column">
${leftHTML}
</div>
<div class="match-column">
${rightHTML}
</div>
</div>
</div>
`;
}





function finishGame1() {
  endTime = Date.now();
  const time = Math.floor((endTime - startTime)/1000);
  let review = "<h3>Results</h3>";
  results.forEach(r => review += `<p>${r}</p>`);
  document.getElementById("quiz").innerHTML = `
    <h1>Great job ${playerName}!</h1>
    <h2>Total time: ${time}s</h2>
    ${review}
    <button onclick="location.reload()">Restart</button>
  `;
}

function finishGame(){
endTime=Date.now();
const time=Math.floor((endTime-startTime)/1000);
let review="";
results.forEach(r=>{
review+=`<div class="result-item">${r}</div>`;
});
document.getElementById("quiz").innerHTML=`
<div class="match-container">
<h1 class="match-title">🌟 Great job ${playerName}!</h1>
<h2 class="match-timer">⏱ Total time: ${time}s</h2>
<div class="results-box">
<h3>📋 Results</h3>
${review}
</div>
<button class="restart-btn"
onclick="location.reload()">
🔄 Restart
</button>
</div>
`;
}









</script>
</body>
</html>
