<script>
let formulae = [];

// ---------- Load JSON ----------
async function loadFormulae()
{
    const response = await fetch("formulae.json");
    formulae = await response.json();
}

// ---------- Show one formula ----------
function showFormula(num)
{
    const f = formulae.find(x => x.num === num);
    if (!f) return;
    document.getElementById("formula").innerHTML += `
        <div class="formula-card">
            <div class="formulae">
                ${f.num}. ${f.title.en}
            </div>
            <!--<h2>${f.title.en}</h2>-->
            <div class="math">
                $$${f.latex}$$
            </div>
        </div>
    `;
}

// ---------- Show several ----------
function showFormulaList(list)
{    document.getElementById("formula").innerHTML = "";
    for(const num of list)
        showFormula(num);
    MathJax.typesetPromise();
}
