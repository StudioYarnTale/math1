<!-- ============================= -->
<!-- *****  The CONTENT AREA ***** -->
<!-- ============================= -->


<div class="match-container">
<h2 class="match-title">📝 Mathematical Test</h2>
<div id="testContainer"class="match-column"></div>
<button class="restart-btn" onclick="checkTest()">✔ Check Result</button>
<h3 id="result" class="match-timer"></h3>
</div>

</div><!--main-wrapper-->
<div class="olisoft-footer">2026 © OliSoft — YarnTale Math Playground</div>


<!--<script src="script/test.js"></script>-->
<script>

let test1 = []
let test2 = []

async function loadTests(){
let r1 = await fetch("jsonfiles/test1.json")
test1 = await r1.json()
let r2 = await fetch("jsonfiles/test2.json")
test2 = await r2.json()
buildTest()
}



function buildTest(){
const container=document.getElementById("testContainer")
let html=""
let q=1
// первые задания (radio)
test1.forEach((t,i)=>{
html+=`<div class="result-item">
<p><span class="q-number">Question ${q}.<br/></span><span class="q-text">${t.question}</span></p>`
t.options.forEach(opt=>{
html+=`<label class="answer-option">
<input type="radio"
name="q${i}"
value="${opt}">
${opt}
</label>`
})
html+="</div>"
q++
})
// последние задания (text)
test2.forEach((t,i)=>{
html+=`<div class="result-item">
<p><span class="q-number">Question ${q}.<br/></span><span class="q-text">${t.question}</span></p>
<input type="text"
id="num${i}"
class="name-input">
</div>`
q++
})
container.innerHTML=html
}



function checkTest(){
	let score = 0
	// проверка первых 4
	test1.forEach((t,i)=>{
	let checked = document.querySelector(`input[name="q${i}"]:checked`)
		if(checked && checked.value == t.answer){
			score += 1
		}
	})
	// проверка числовых
	test2.forEach((t,i)=>{
	let val = document.getElementById(`num${i}`).value
	val = parseFloat(val)
	if(!isNaN(val)){
		let user = Number(val.toFixed(2))
		let correct = Number(parseFloat(t.answer).toFixed(2))
		if(user == correct){
			score += 3
		}
	}
	})
	document.getElementById("result").innerText ="Result: " + score + " / 10"
}

loadTests()

</script>
</body>
