<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Contact</title>

<link rel="stylesheet" href="math_green.css">

<style>.slider{
display:flex;
align-items:center;
justify-content:center;
gap:20px;
margin:40px;
}

.slider img{
max-width:500px;
max-height:400px;
border-radius:6px;
}

.slider button{
font-size:20px;
padding:5px 12px;
cursor:pointer;
}
</style>

</head>

<body>


<div class="slider">

<button onclick="prevImage()">◀</button>

<img id="slideImage" src="images/img1.jpg">

<button onclick="nextImage()">▶</button>

</div>




<script>

const images = [
"images/img1.jpg",
"images/img2.jpg",
"images/img3.jpg",
"images/img4.jpg"
];

let index = 0;

const img = document.getElementById("slideImage");

function showImage(){
img.src = images[index];
}

function nextImage(){
index++;
if(index >= images.length) index = 0;
showImage();
}

function prevImage(){
index--;
if(index < 0) index = images.length - 1;
showImage();
}

</script>

</body>
</html>
