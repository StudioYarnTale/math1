<!DOCTYPE html>
<html lang="en">


<head>
<meta charset="UTF-8">
<title>Calculator - YT Math Playground  ©OliSoft 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interactive mathematical playground: calculator, function grapher, geometry tools.">
<meta name="author" content="OliSoft">
<!-- main theme -->
<link rel="stylesheet" href="math_green.css">
<!-- favicon -->
<link rel="icon" type="image/png" href="images/ytmath_icon.png">


<style>
.calc-wrapper{width:700px; position:relative; color:#5D7B7E;}
.olisoft{color:#5D7B7E; font-size:12px; font-family: Cambria Math;font-style: italic; }
img.h2img{width:40px;}

h2{
font-family: Cambria Math; 
font-style: italic;
color:#3f5f60;
font-size:26px;
}

p{
font-family: Cambria Math; 
font-style: italic;
color:#112211
font-size:14px;
}

.logo-yt{
position:absolute;
top:-50px;
right:-10px;
width:130px;
height:auto;
cursor:pointer;
transition:transform 0.2s;
}

.logo-yt:hover{transform:scale(1.05);}

.calc-buttons button {padding: 10px 20px; font-size: 16px; cursor: pointer;  height:40px;}
.func-buttons button {padding: 10px 6px;; font-size: 16px; cursor: pointer;  height:40px;}




</style>
</head>

<body>

<div class="calc-panel">

<div class="calc-wrapper">
<a href="<a href="index.html"><img src="images/ytmath_logo.png" class="logo-yt"></a>



<h2><img class="h2img" src="images/abacus.png"/>Scientific Calculator</h2>

    <div class="calc-buttons">
    <i>x = </i><input style="width:220px; height:30px;" id="calcInput" placeholder="Enter argument">
        <button style="width:110px;" onclick="calculate()"><b>Calculate</b></button>  
        <button style="width:45px; padding:10px 5px;" onclick="deleteLast()">←</button>      
        <button style="width:95px;" onclick="clearCalc()">Clear</button>
    </div>

	<div class="func-buttons">
    <!-- числа -->
    <button onclick="insertFunc('1')">1</button>
    <button onclick="insertFunc('2')">2</button>
    <button onclick="insertFunc('3')">3</button>
    <button onclick="insertFunc('4')">4</button>
    <button onclick="insertFunc('5')">5</button>

    <button onclick="insertFunc('6')">6</button>
    <button onclick="insertFunc('7')">7</button>
    <button onclick="insertFunc('8')">8</button>
    <button onclick="insertFunc('9')">9</button>
    <button onclick="insertFunc('0')">0</button>

    <button onclick="insertFunc('+')">+</button>
    <button onclick="insertFunc('-')">−</button>
    <button onclick="insertFunc('*')">×</button>
    <button onclick="insertFunc('/')">÷</button>
    <button onclick="insertFunc('^')">^</button>

    <button onclick="insertFunc('Math.E')">e</button>
    <button onclick="insertFunc('Math.PI')">π</button>
    <button onclick="insertFunc('(')">(</button>
    <button onclick="insertFunc(')')">)</button>  
    <button onclick="insertFunc('.')">.</button>
  
    <!-- функции -->
    <button onclick="wrapCalc('(', ')^2')">x<sup>2</sup></button>
    <button onclick="wrapCalc('(', ')^3')">x<sup>3</sup></button>
    <button onclick="wrapCalc('1/(')">1/x</button>
    <button onclick="wrapCalc('sqrt(')">√x</button>
    <button onclick="wrapRoot(3)">∛x</button>

    
    <button onclick="wrapCalc('abs(')">abs</button>
    <button onclick="wrapCalc('exp(')">exp</button>
    <button onclick="wrapCalc('log(')">ln</button>
    <button onclick="wrapCalc('log10(')">lg</button>
    <button onclick="negateCalc()">/-/</button>
    </div>
 <br/>
    <div class="func-buttons" style="grid-template-columns: repeat(8, 50px);">
    <button onclick="wrapCalc('sin(')">sin</button>
    <button onclick="wrapCalc('cos(')">cos</button>
    <button onclick="wrapCalc('tan(')">tan</button>
    <button onclick="wrapCalc('asin(')">asin</button>
    <button onclick="wrapCalc('acos(')">acos</button>
    <button onclick="wrapCalc('atan(')">atan</button>
	<button onclick="toDeg()">deg</button>
	<button onclick="toRad()">rad</button>
    </div>    
    <div class="func-buttons" style="grid-template-columns: repeat(6, 50px);">
    <button onclick="wrapCalc('sinh(')">sh</button>
    <button onclick="wrapCalc('cosh(')">ch</button>
    <button onclick="wrapCalc('tanh(')">th</button>
    <button onclick="wrapCalc('asinh(')">ash</button>
    <button onclick="wrapCalc('acosh(')">ach</button>
    <button onclick="wrapCalc('atanh(')">ath</button>
    </div>


	<div class="result-row">
		<div id="calcResult" class="result-text"></div>
	</div>
	<div id="scientificBox" class="scientific-box"></div>


    <h4>History</h4>
    <ul id="calcHistory"></ul>
	<p class="olisoft">2026  © OliSoft - YarnTale Math Playground. All rights reserved.</p>
	</div>
	
</div> <!-- cаlculator-->

</div>




</div> <!--grapher-->


<script src="script/calculator.js"></script>
</body>
</html>
