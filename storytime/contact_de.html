<style>
    
/* ===== CONTACT FORM — YarnTale style ===== */
.contact-box{
max-width:600px;
margin:10px auto;
padding:50px;
padding-top:10px;
background:#f5fbfa;
border:2px solid #78AFAC;
border-radius:20px;
box-shadow:0 6px 18px rgba(120,175,172,0.18);
background:linear-gradient(180deg, #ffffff 0%,#f5fbfa 100%);
}

/* Заголовок */
.contact-box h2{
font-size:28px;
color:#5a8d8a;
margin-top:0px;
margin-bottom:10px;
text-align:center;
}

/* Описание */
.contact-box p{
font-size:15px;
color:#5a8d8a;
margin-bottom:10px;
text-align:center;
}

/* Подписи */
.contact-box label{
font-size:15px;
color:#5a8d8a;
font-weight:bold;
display:block;
margin-top:10px;
}

/* Поля ввода */
.contact-box input,
.contact-box textarea{
width:100%;
padding:10px 12px;
border:2px solid #c7dede;
border-radius:12px;
background:#ffffff;
font-size:15px;
color:#5c4633;
transition:all 0.2s ease;
}

/* При фокусе */
.contact-box input:focus,
.contact-box textarea:focus{
outline:none;
border-color:#78AFAC;
background:#f9fdfd;
box-shadow:0 0 6px rgba(120,175,172,0.25);
}

/* Кнопка */
.contact-box button{
margin-top:10px;
padding:10px 12px;
background:#78AFAC;
color:white;
border:none;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:all 0.2s ease;
}

/* Hover кнопки */
.contact-box button:hover{
background:#5a8d8a;
transform:translateY(-2px);
box-shadow:0 4px 10px rgba(90,141,138,0.3);
}

/* Сообщение статуса */
#formStatus{
margin-top:12px;
font-size:14px;
color:#5a8d8a;
text-align:center;
}

</style>
</head>

<div class="contact-box">
<h2>Nachricht senden</h2>
<p>Wenn Sie möchten, können Sie eine kurze Nachricht senden.<br/>Ich lese von Zeit zu Zeit Briefe und antworte, wenn es möglich ist.</p>
<form id="contactForm" action="https://formspree.io/f/yourID" method="POST">
<label>Betreff</label><input type="text" name="subject" required>
<label>Nachricht</label><textarea name="message" rows="5" required></textarea>
<label>Ihr Name</label><input type="text" name="name">
<label>Email</label><input type="email" name="email">
<!-- анти-бот поле -->
<input type="text" name="website" style="display:none">
<button type="submit">📩 Nachricht senden</button>
</form>
<p id="formStatus"></p>
</div>


</div> <!--content-area-->
</div><!--main-wrapper-->

<div class="olisoft-footer">2026 © OliSoft — YarnTale Mathe-Spielplatz</div>


<script>
const form = document.getElementById("contactForm")
const status = document.getElementById("formStatus")
form.addEventListener("submit", async function(e){
e.preventDefault()
let data = new FormData(form)
let response = await fetch(form.action,{
method:form.method,
body:data,
headers:{ 'Accept':'application/json'}
})
if(response.ok){
status.innerHTML="Message sent. Thank you."
form.reset()
}else{
status.innerHTML="Something went wrong."
}
})
</script>
