<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cartesian Prametric  Polar Functions </title>
<style>



body{
background:#ffffff;
margin:0;
padding:20px;
display:flex;
justify-content:center;
align-items:flex-start;
}

.app-container{
	background:#f4f7f7; 
		background:#B1D1D2;
    max-width: 1000px;
    margin: auto;
    padding: 25px;
	box-shadow:0 3px 10px rgba(0,0,0,0.08); 
	border-radius: 8px;
	/*border: 1px solid #8fb3cc;*/
	border: 1px solid #668585;
}


.toolbar{
    /*display:flex;*/
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

canvas{
	border:2px solid #8fb3cc;
	border-radius:14px;
	background:white;
	box-shadow:0 3px 10px rgba(0,0,0,0.1); 
	width:100%;
	max-width:840px;
	height:auto;
}



div.main{}
div.canvas{}
div.top-buttons{}

canvas{cursor:crosshair;}

#coords{
margin-top:10px;
font-family:Cambria Math;
color:#3f5f60;
font-size:14px;
}


button {        
		padding:4px 10px;
        font-size:14px;
		font-family:Cambria Math;
        margin-left:5px;
        cursor:pointer;
		background: #e8f1fa;       /* светлее и голубее */
		border: 1px solid #8fb3cc; /* темнее рамка */
		border-radius: 8px;
        transition: 0.2s;    
		background: linear-gradient(#E9EEEF, #D8E9EA);
		border: 1px solid #8AADAD;
}
button:hover {
background: #A9D2D4;
background: #5D7B7E;
color:#ffffff;
border: 1px solid #405E5E;
}

	
button.colour {width:25px; height:25px; background:#cc0000; border: 1px solid #999999;}
		

.top-buttons button{
    display:inline-block;    
	transition: 0.3s;
    transition: transform 0.15s, filter 0.15s;    
	cursor:pointer;
}

button.colour:hover{
    /* transform: scale(1); */
    filter: brightness(120%);
    border:1px solid #666666;
}

input.func{height:22px;}
.func{height:22px; font-family:Cambria Math;}



.legendItem{
font-family:Cambria Math;
margin-top:10px;
margin-bottom:4px;
font-weight:bold;
}

.funcBlock{
margin-top:15px;
}

.table{
border-collapse:collapse;
font-family:Cambria Math;
}

.table td, .table th{
border:1px solid #9bb;
padding:3px 6px;
text-align:center;
}

</style>
</head>

<body>
<div class="main">

<div class="app-container">

<div class="top-buttons">

<div class="toolbar">

<h2>Function Grapher</h2>
<select class="func" style="height:25px; width:150px;"  id="functionType" onchange="updateFunctionInputs()">
<option value="cartesian">Cartesian</option>
<option value="parametric">Parametric</option>
<option value="polar">Polar</option>
</select>  &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;

<i>x<sub>min</sub></i> <input class="func" id="xmin" value="-10" size="4"> &nbsp; 
<i>x<sub>max</sub></i> <input class="func" id="xmax" value="10" size="4"> 
<button onclick="updateRange()">Set range</button>
<br/><br/>

<span id="cartesianBlock"><i>f(x) = </i>
<input id="fx" class="func" style="width:220px" placeholder="Example: sin(x)">
</span>


<span id="parametricBlock" style="display:none">
<i>x(t) = </i>
<input id="xt" class="func" style="width:160px"> &nbsp;
<i>y(t) = </i>
<input id="yt" class="func" style="width:160px">
</span>


<span id="polarBlock" style="display:none">

<i>r(φ) = </i>
<input id="rf" class="func" style="width:260px" placeholder="Example: sin(3*φ)">

</span>

<button onclick="drawFunctionInput()">Draw Function</button>
<button onclick="clearFunctions()">Clear</button>
</div>


<div class="toolbar">
<button class="colour" style="background:#cc0000;" onclick="setColor('#cc0000')"></button> 
<button class="colour" style="background:#00cc00;" onclick="setColor('#00cc00')"></button> 
<button class="colour" style="background:#0000cc;" onclick="setColor('#0000cc')"></button> 
<button class="colour" style="background:#cc6f00;" onclick="setColor('#cc6f00')"></button> 
<button class="colour" style="background:#009999;" onclick="setColor('#009999')"></button> 
<button class="colour" style="background:#cc0099;" onclick="setColor('#cc0099')"></button> 

<label style="margin-left:10px;">
<input type="checkbox" id="snapToggle" checked>
Snap to grid
</label>  &nbsp;  &nbsp;  &nbsp; &nbsp;  &nbsp;  &nbsp;
<button onclick="mode='point'">Draw Point</button> 
<button onclick="mode='vector'">Draw Vector</button>  
<br/><br/>
<button onclick="clearCanvas()">Clear Canvas</button> 
</div>

</div>


<div class="canvas">
<canvas id="grid" width="840" height="840"></canvas>
<div id="coords"></div>


</div>

<div id="functionTables"></div>
</div> <!--main-->


<script src="script/function_old.js"></script>
<div>
</body>
</html>
