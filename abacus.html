<script>

const rows = document.querySelectorAll(".row")

rows.forEach(row => {
    const left = row.querySelector(".left")
    for(let i=0;i<10;i++){
        const bead = document.createElement("button")
        bead.className = "bead"
        left.appendChild(bead)
        bead.onclick = () => moveBead(bead)
    }
})


function moveBead(bead){
    const row = bead.closest(".row")
    const left = row.querySelector(".left")
    const right = row.querySelector(".right")
    if(bead.parentNode === left)
        right.appendChild(bead)
    else
        left.appendChild(bead)
    updateNumber()
}

function updateNumber1(){
let total = 0
const rows = document.querySelectorAll(".row")
const labels = document.querySelectorAll(".labels-right div")
rows.forEach((row,i) => {
const place = parseFloat(row.dataset.place)
const count = row.querySelector(".right").children.length
labels[i].textContent = count   // ← обновляем цифру справа
total += place * count
})
document.getElementById("number").textContent = total
}


function updateNumber(){

let rows = document.querySelectorAll(".row")
let labels = document.querySelectorAll(".labels-right div")

let counts = []

// читаем количество косточек
rows.forEach(row=>{
    counts.push(row.querySelector(".right").children.length)
})

// перенос разрядов
for(let i=counts.length-1; i>0; i--){
    if(counts[i] >= 10){
        counts[i-1] += Math.floor(counts[i]/10)
        counts[i] = counts[i] % 10
    }
}

// применяем обратно к абакусу
rows.forEach((row,i)=>{

    const left = row.querySelector(".left")
    const right = row.querySelector(".right")

    while(right.firstChild){
        left.appendChild(right.firstChild)
    }

    for(let j=0;j<counts[i];j++){
        const bead = left.lastElementChild
        if(bead) right.appendChild(bead)
    }

    labels[i].textContent = counts[i]
})

// считаем число
let total = 0
rows.forEach((row,i)=>{
    const place = parseFloat(row.dataset.place)
    total += counts[i] * place
})

document.getElementById("number").textContent = total
}







document.querySelectorAll(".row").forEach(row => {
const addBtn = row.querySelector(".btn-add")
const resetBtn = row.querySelector(".btn-reset")
const left = row.querySelector(".left")
const right = row.querySelector(".right")

addBtn.onclick = () => {
const bead = left.lastElementChild
if(bead){
right.appendChild(bead)
updateNumber()
}
}
resetBtn.onclick = () => {
while(right.firstChild){
left.appendChild(right.firstChild)
}
updateNumber()
}
})

function setAbacus(){

const value = parseFloat(document.getElementById("inputNumber").value)

const rows = document.querySelectorAll(".row")

rows.forEach(row=>{
const left = row.querySelector(".left")
const right = row.querySelector(".right")

while(right.firstChild){
left.appendChild(right.firstChild)
}
})

rows.forEach(row=>{
const place = parseFloat(row.dataset.place)
const right = row.querySelector(".right")
const left = row.querySelector(".left")
const digit = Math.floor(value/place)%10
for(let i=0;i<digit;i++){
const bead = left.lastElementChild
if(bead) right.appendChild(bead)
}
})
updateNumber()
}




function resetAll(){
const rows = document.querySelectorAll(".row")
rows.forEach(row => {
    const left = row.querySelector(".left")
    const right = row.querySelector(".right")
    // переносим все косточки обратно влево
    while(right.firstChild){
        left.appendChild(right.firstChild)
    }
})
// обновляем число
updateNumber()
}
